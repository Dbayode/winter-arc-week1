services:
  secure-app:
    build:
      context: .
    image: winter-arc-security:v1

    ports:
      - "127.0.0.1:3097:3000"

    user: "1000:1000"

    read_only: true

    cap_drop:
      - ALL

#    security_opt:
#      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.5

    restart: unless-stopped
